# Starts a PostgreSQL database:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prayas
      POSTGRES_PASSWORD: prayas_pw
      POSTGRES_DB: prayas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
